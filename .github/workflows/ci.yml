name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Validate production-baseline replay script syntax
        run: bash -n scripts/verify-production-baseline-replay.sh
      - run: npm run test:membership
      - run: npm run test:global
      - run: npm run build
      - name: Build the unified single-app edition
        run: VITE_APP_EDITION=unified npm run build
      - name: Verify unified build configuration
        run: VITE_APP_EDITION=unified npm run verify:build-env
