name: Validate Plivex migration branch

on:
  push:
    branches: [remove-lovable, h1/migration-inventory]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions
        run: |
          deno check supabase/functions/_shared/team.ts supabase/functions/_shared/payu.ts supabase/functions/_shared/email.ts
          deno check supabase/functions/ensure-owner-role/index.ts supabase/functions/send-team-invite/index.ts supabase/functions/send-payment-reminder/index.ts supabase/functions/verify-invite-code/index.ts
          deno check supabase/functions/manage-workspace-member/index.ts supabase/functions/get-workspace-team/index.ts
          deno check supabase/functions/ping-presence/index.ts supabase/functions/track-staff-action/index.ts supabase/functions/get-team-presence/index.ts
          deno check supabase/functions/get-access-status/index.ts supabase/functions/create-payu-order/index.ts supabase/functions/verify-payu-payment/index.ts
          deno check supabase/functions/workspace-records/index.ts supabase/functions/list-invoices/index.ts
          deno check supabase/functions/save-invoice/index.ts supabase/functions/set-invoice-status/index.ts
      - name: Lint
        run: npm run lint
      - name: Membership tests
        run: npm run test:membership
      - name: Production build
        run: npm run build
