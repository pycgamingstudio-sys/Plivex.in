name: Validate Plivex migration branch
# Exact-payment refund and full migration replay coverage also runs in the Global Foundation, Stage 4, and PostgreSQL workflows.

on:
  push:
    branches: [remove-lovable, h1/migration-inventory]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every Edge Function entrypoint
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t edge_entrypoints < <(find supabase/functions -type f -name index.ts -print | sort)
          if [ "${#edge_entrypoints[@]}" -lt 54 ]; then
            printf 'Expected at least 54 versioned Edge Function entrypoints, found %s\\n' "${#edge_entrypoints[@]}"
            exit 1
          fi
          printf 'Type-checking %s Edge Function entrypoints\\n' "${#edge_entrypoints[@]}"
          deno check --node-modules-dir=auto "${edge_entrypoints[@]}"
      - name: Cashfree refund handler regression tests
        run: deno test supabase/functions/cashfree-webhook/refund.test.ts
      - name: Lint
        run: npm run lint
      - name: Membership tests
        run: npm run test:membership
      - name: Production build
        run: npm run build
      - name: Install Playwright and Chromium for browser smoke tests
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser smoke tests
        run: npx playwright test --config=playwright.config.mjs
