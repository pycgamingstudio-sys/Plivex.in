name: Verify production backup restore

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "Optional GitHub Actions run ID for an existing encrypted backup artifact"
        required: false
        type: string
  workflow_run:
    workflows: ["Manual production database backup"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-production-backup-restore.yml
      - scripts/verify-production-baseline-replay.sh

permissions:
  actions: read
  contents: read

jobs:
  restore-verification:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    name: Decrypt and restore into disposable Supabase PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_ENCRYPTION_KEY" || { echo "::error::Missing BACKUP_ENCRYPTION_KEY repository secret."; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo "::error::Missing SUPABASE_DB_URL repository secret."; exit 1; }

      - name: Select latest successful production backup for push-triggered verification
        id: select-backup
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/manual-production-db-backup.yml/runs?branch=main&status=success&per_page=10")"
          run_id="$(printf '%s' "$response" | jq -r '.workflow_runs[0].id // empty')"
          test -n "$run_id" || { echo "::error::No successful production backup run is available."; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Download the selected encrypted backup artifact
        uses: actions/download-artifact@v4
        with:
          name: plivex-production-db-backup
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.backup_run_id || steps.select-backup.outputs.run_id }}
          path: backup-artifact

      - name: Verify checksum and decrypt backup
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          cd backup-artifact
          sha256sum -c production-db-backup.tar.gz.enc.sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -in production-db-backup.tar.gz.enc -out production-db-backup.tar.gz -pass env:BACKUP_ENCRYPTION_KEY
          tar -tzf production-db-backup.tar.gz
          mkdir -p ../backup
          tar -xzf production-db-backup.tar.gz -C ../backup
          test -s ../backup/roles.sql
          test -s ../backup/auth-schema.sql
          test -s ../backup/auth-data.sql
          test -s ../backup/storage-schema.sql
          test -s ../backup/storage-data.sql
          test -s ../backup/migration-ledger.tsv
          test -s ../backup/schema.sql
          test -s ../backup/data.sql
          cd ..
          echo "Encrypted artifact checksum, decryption and archive structure verified."
          echo "Schema dump custom-type declarations:"
          grep -n -C 3 'app_role' backup/schema.sql | head -240 || true
          echo "Schema dump statements affecting public schema:"
          grep -n -E '^(DROP SCHEMA|CREATE SCHEMA|DROP TYPE|CREATE TYPE).*public|app_role' backup/schema.sql | head -160 || true

      - name: Compare archived migration ledger with current production
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -A -t -F '|' \
            -c "SELECT version, name FROM supabase_migrations.schema_migrations ORDER BY version" \
            > /tmp/plivex-live-migration-ledger.tsv
          diff -u backup/migration-ledger.tsv /tmp/plivex-live-migration-ledger.tsv
          echo "PASS: the encrypted backup's exact migration ledger matches production."


      - name: Start disposable Supabase PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name plivex-production-restore-test \
            --publish 5432:5432 \
            --env POSTGRES_USER=supabase_admin \
            --env POSTGRES_PASSWORD=restore-test-only \
            --env POSTGRES_DB=postgres \
            supabase/postgres:17.6.1.136 \
            postgres -c config_file=/etc/postgresql/postgresql.conf \
              -c shared_preload_libraries=pg_cron,pg_net \
              -c cron.database_name=postgres
          ready=0
          for attempt in $(seq 1 90); do
            if docker exec -u postgres plivex-production-restore-test \
              psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -Atqc 'SELECT 1' 2>/dev/null | grep -qx '1'; then
              sleep 2
              if docker exec -u postgres plivex-production-restore-test \
                psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -Atqc 'SELECT 1' 2>/dev/null | grep -qx '1'; then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then docker logs plivex-production-restore-test; exit 1; fi

      - name: Prepare extensions and managed schemas for full Auth restore
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres plivex-production-restore-test \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -c \
            'CREATE SCHEMA IF NOT EXISTS extensions; CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;'
          docker exec -i -u postgres plivex-production-restore-test \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -f /dev/stdin \
            < supabase/tests/migration-replay-bootstrap.sql
          # The bootstrap creates only a minimal test auth schema. Replace it
          # with the complete encrypted auth schema/data from the production dump.
          docker exec -u postgres plivex-production-restore-test \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -c \
            'DROP SCHEMA auth CASCADE; DROP SCHEMA storage CASCADE; DROP TABLE IF EXISTS public.stage4_vault_secrets CASCADE; DROP FUNCTION IF EXISTS public.set_updated_at();'

      - name: Restore roles, schema and data into the disposable database
        shell: bash
        run: |
          set -euo pipefail
          # Supabase's role-only dump may contain CREATE ROLE statements for roles
          # already present in the Supabase Postgres image. Allow only those
          # expected duplicate-role notices; fail on every other SQL error.
          set +e
          docker exec -i -u postgres plivex-production-restore-test \
            psql -X -U supabase_admin -d postgres -f /dev/stdin \
            < backup/roles.sql > /tmp/plivex-restore-roles.log 2>&1
          role_status=$?
          set -e
          if grep -E 'ERROR:' /tmp/plivex-restore-roles.log | grep -Ev 'already exists' >/tmp/plivex-unexpected-role-errors.log; then
            cat /tmp/plivex-unexpected-role-errors.log
            exit 1
          fi
          if [ "$role_status" -ne 0 ] && [ -s /tmp/plivex-unexpected-role-errors.log ]; then
            exit "$role_status"
          fi
          # Auth schema triggers reference the public user hook. Install a no-op
          # placeholder during data restoration so historical auth.users rows do
          # not create or mutate production profiles/workspaces in the test DB.
          # The real function is restored from schema.sql below.
          docker exec -i -u postgres plivex-production-restore-test \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -c \
            "CREATE OR REPLACE FUNCTION public.handle_new_user() RETURNS trigger LANGUAGE plpgsql AS 'BEGIN RETURN NEW; END';"
          # Create public.app_role before Auth schema restore because the
          # production Auth dump contains functions that reference this app type.
          # Restore app_role before any functions/tables that depend on it.
          # Parse the enum statement from the encrypted production schema dump
          # with Python so quoting/awk-regex differences cannot silently skip it.
          python3 - <<'PY'
          from pathlib import Path
          lines = Path("backup/schema.sql").read_text().splitlines()
          start = next((i for i, line in enumerate(lines)
                        if line.strip().startswith('CREATE TYPE "public"."app_role" AS ENUM (')), None)
          if start is None:
              raise SystemExit("app_role enum declaration missing from production schema dump")
          end = next((i for i in range(start + 1, len(lines))
                      if lines[i].strip() == ");"), None)
          if end is None:
              raise SystemExit("app_role enum declaration is unterminated")
          enum_sql = "\n".join(lines[start:end + 1]) + "\n"
          Path("/tmp/plivex-app-role.sql").write_text(
              "DROP TYPE IF EXISTS public.app_role CASCADE;\n" + enum_sql
          )
          filtered = []
          skipping = False
          for line in lines:
              if line.strip().startswith('CREATE TYPE "public"."app_role" AS ENUM ('):
                  skipping = True
                  continue
              if skipping:
                  if line.strip() == ");":
                      skipping = False
                  continue
              if line.strip() == 'ALTER TYPE "public"."app_role" OWNER TO "postgres";':
                  continue
              filtered.append(line)
          if skipping:
              raise SystemExit("app_role enum removal did not terminate")
          Path("/tmp/plivex-schema-without-app-role.sql").write_text("\n".join(filtered) + "\n")
          PY
          # The disposable Supabase image can contain a stale/preloaded
          # app_role type. Recreate it from the production dump before restoring
          # dependent functions. This database is disposable and isolated.
          echo "Extracted app_role SQL:"
          cat /tmp/plivex-app-role.sql
          docker exec -i -u postgres plivex-production-restore-test \
            psql -X -a -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -f /dev/stdin \
            < /tmp/plivex-app-role.sql
          echo "app_role immediately after bootstrap: $(docker exec -u postgres plivex-production-restore-test psql -X -U supabase_admin -d postgres -Atqc "SELECT COALESCE(to_regtype('public.app_role')::text, 'NULL')")"
          echo "Confirm app_role exists before Auth schema replay"
          test "$(docker exec -u postgres plivex-production-restore-test psql -X -U supabase_admin -d postgres -Atqc "SELECT COALESCE(to_regtype('public.app_role')::text, 'NULL')")" = "app_role"
          # The auth dump includes a public trigger/helper function that depends
          # on has_ws_role. Install a harmless placeholder until schema.sql
          # restores the real workspace-role implementation later.
          docker exec -i -u postgres plivex-production-restore-test \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -f /dev/stdin <<'SQL'
          CREATE OR REPLACE FUNCTION public.has_ws_role(_ws text, _roles public.app_role[])
          RETURNS boolean LANGUAGE sql STABLE AS $fn$ SELECT false $fn$;
          SQL
          echo "RESTORE AUTH SCHEMA"
          docker exec -i -u postgres plivex-production-restore-test \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -f /dev/stdin \
            < backup/auth-schema.sql
          echo "Clear disposable Auth seed rows before restoring production Auth data"
          docker exec -i -u postgres plivex-production-restore-test \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -f /dev/stdin <<'SQL'
          DO $truncate_auth$
          DECLARE r record;
          BEGIN
            FOR r IN SELECT schemaname, tablename FROM pg_tables WHERE schemaname = 'auth'
            LOOP
              EXECUTE format('TRUNCATE TABLE %I.%I CASCADE', r.schemaname, r.tablename);
            END LOOP;
          END
          $truncate_auth$;
          SQL
          echo "RESTORE AUTH DATA"
          docker exec -i -u postgres plivex-production-restore-test \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -f /dev/stdin \
            < backup/auth-data.sql
          echo "RESTORE STORAGE SCHEMA"
          docker exec -i -u postgres plivex-production-restore-test \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -f /dev/stdin \
            < backup/storage-schema.sql
          echo "Clear disposable Storage seed rows before restoring production Storage metadata"
          docker exec -i -u postgres plivex-production-restore-test \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -f /dev/stdin <<'SQL'
          DO $truncate_storage$
          DECLARE r record;
          BEGIN
            FOR r IN SELECT schemaname, tablename FROM pg_tables WHERE schemaname = 'storage'
            LOOP
              EXECUTE format('TRUNCATE TABLE %I.%I CASCADE', r.schemaname, r.tablename);
            END LOOP;
          END
          $truncate_storage$;
          SQL
          echo "RESTORE STORAGE DATA"
          docker exec -i -u postgres plivex-production-restore-test \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -f /dev/stdin \
            < backup/storage-data.sql
          echo "RESTORE PUBLIC/GLOBAL SCHEMA"
          echo "Restore public/global schema without duplicate app_role declaration"
          docker exec -i -u postgres plivex-production-restore-test \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -f /dev/stdin \
            < /tmp/plivex-schema-without-app-role.sql
          echo "app_role after schema replay: $(docker exec -u postgres plivex-production-restore-test psql -X -U supabase_admin -d postgres -Atqc "SELECT COALESCE(to_regtype('public.app_role')::text, 'NULL')")"
          echo "Confirm app_role remains after public/global schema replay"
          test "$(docker exec -u postgres plivex-production-restore-test psql -X -U supabase_admin -d postgres -Atqc "SELECT COALESCE(to_regtype('public.app_role')::text, 'NULL')")" = "app_role"
          echo "RESTORE APPLICATION DATA"
          docker exec -i -u postgres plivex-production-restore-test \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -f /dev/stdin \
            < backup/data.sql
          echo "Roles, schema and data restore commands completed."

      - name: Replay pending Parts 1-8 against the restored production baseline
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: supabase_admin
          PGPASSWORD: restore-test-only
          PGDATABASE: postgres
        run: bash scripts/verify-production-baseline-replay.sh

      - name: Verify restored application schema, RLS and row counts
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i -u postgres plivex-production-restore-test \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -f /dev/stdin <<'SQL'
          DO $verify$
          DECLARE
            missing text;
            unprotected text;
          BEGIN
            SELECT string_agg(x.name, ', ')
              INTO missing
            FROM (VALUES
              ('public.profiles'),('public.subscriptions'),('public.payment_logs'),
              ('public.plan_limits'),('public.plan_features'),('public.usage_counters'),
              ('public.invoice_share_links'),('global.workspaces'),('global.workspace_members'),
              ('global.clients'),('global.products'),('global.stock_levels'),
              ('global.stock_movements'),('global.invoices'),('global.invoice_items'),
              ('global.invoice_payments'),('global.expenses')
            ) AS x(name)
            WHERE to_regclass(x.name) IS NULL;
            IF missing IS NOT NULL THEN
              RAISE EXCEPTION 'Restore is missing required application tables: %', missing;
            END IF;
            IF to_regclass('auth.users') IS NULL
               OR to_regclass('storage.buckets') IS NULL
               OR to_regclass('storage.objects') IS NULL THEN
              RAISE EXCEPTION 'Restore is missing Auth users or Storage metadata tables';
            END IF;
            IF EXISTS (
              SELECT 1 FROM public.profiles p
              LEFT JOIN auth.users u ON u.id = p.id
              WHERE u.id IS NULL
            ) THEN
              RAISE EXCEPTION 'Restored public profiles contain Auth user IDs missing from auth.users';
            END IF;

            SELECT string_agg(x.name, ', ')
              INTO unprotected
            FROM (VALUES
              ('public.profiles'),('public.subscriptions'),('public.payment_logs'),
              ('public.plan_limits'),('public.plan_features'),('public.usage_counters'),
              ('public.invoice_share_links'),('global.workspaces'),('global.workspace_members'),
              ('global.clients'),('global.products'),('global.stock_levels'),
              ('global.stock_movements'),('global.invoices'),('global.invoice_items'),
              ('global.invoice_payments'),('global.expenses')
            ) AS x(name)
            WHERE NOT COALESCE((
              SELECT c.relrowsecurity
              FROM pg_class c
              WHERE c.oid = to_regclass(x.name)
            ), false);
            IF unprotected IS NOT NULL THEN
              RAISE EXCEPTION 'Restore contains application tables without RLS: %', unprotected;
            END IF;
          END
          $verify$;

          SELECT 'auth.users' AS table_name, count(*) AS rows FROM auth.users
          UNION ALL SELECT 'storage.objects', count(*) FROM storage.objects
          UNION ALL SELECT 'profiles', count(*) FROM public.profiles
          UNION ALL SELECT 'subscriptions', count(*) FROM public.subscriptions
          UNION ALL SELECT 'payment_logs', count(*) FROM public.payment_logs
          UNION ALL SELECT 'global.workspaces', count(*) FROM global.workspaces
          UNION ALL SELECT 'global.invoices', count(*) FROM global.invoices
          UNION ALL SELECT 'global.products', count(*) FROM global.products
          UNION ALL SELECT 'global.expenses', count(*) FROM global.expenses
          ORDER BY table_name;
          SQL

      - name: Always stop disposable database
        if: always()
        run: docker rm --force plivex-production-restore-test || true
