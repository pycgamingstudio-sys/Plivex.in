name: Global Foundation CI

on:
  push:
    branches: [global-dev]
  pull_request:
    branches: [global-dev]

permissions:
  contents: read

concurrency:
  group: global-foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test isolated Global foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run existing India team regression tests
        run: npm run test:membership

      - name: Run Global foundation and country selection tests
        run: npm run test:global

      - name: Type-check assistant Edge Functions with Deno
        run: deno check supabase/functions/assistant-chat/index.ts supabase/functions/assistant-confirm/index.ts

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Build application
        run: npm run build
      - name: Verify public build configuration
        run: npm run verify:build-env
