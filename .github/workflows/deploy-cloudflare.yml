name: Deploy Plivex to Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plivex-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify deployment credential is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository Actions secret before deploying."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run membership tests
        run: npm run test:membership

      - name: Build production app
        run: npm run build

      - name: Deploy existing Plivex Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b85d15e337a2d822cfa53bd62731e44b
          command: deploy
