project_id = "sqzpaiibmfsvarrkwkvb"

# Cashfree calls these endpoints directly. JWT is disabled only at the gateway;
# each request is authenticated by Cashfree's HMAC webhook signature or by the
# signed, opaque order ID followed by server-to-server Cashfree verification.
[functions.cashfree-webhook]
verify_jwt = false

[functions.cashfree-return]
verify_jwt = false

# User-facing subscription operations still require a valid Supabase JWT.
[functions.create-cashfree-order]
verify_jwt = true

[functions.manage-cashfree-subscription]
verify_jwt = true

# Global business records use their own schema and validate membership in the handler.
[functions.global-business-records]
verify_jwt = true

# Global enterprise workspace controls require a verified Supabase JWT.
[functions.global-enterprise]
verify_jwt = true

[functions.global-export]
verify_jwt = true

# Global CRM, warehouse, transfers and procurement operations require a verified JWT.
[functions.global-part4]
verify_jwt = true

# Public supplier portal actions authenticate with single-use token hashes;
# internal invite/list/review actions validate the Supabase JWT in the handler.
[functions.global-supplier-portal]
verify_jwt = false

# Global accounting operations require a verified Supabase JWT.
[functions.global-accounting]
verify_jwt = true

# Global platform API authenticates workspace actions in-handler and accepts
# one-time public signing links / scoped x-plivex-key requests without a user JWT.
[functions.global-platform]
verify_jwt = false

# Meta verifies the WhatsApp webhook challenge and HMAC signature in the handler.
[functions.whatsapp-webhook]
verify_jwt = false
